[tool.poetry]
name = "wysdom-backend"
version = "0.1.0"
description = "Backend architecture for the Wysdom engineering intelligence platform"
authors = ["Vanshu <vanshu@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
pydantic = "^2.9.0"
pydantic-settings = "^2.4.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.51"}
asyncpg = "^0.29.0"
redis = "^5.0.0"
langgraph = "^0.2.0"
pinecone-client = "^3.0.0"
psycopg2 = "^2.9.12"
tree-sitter = "^0.26.0"
pymupdf = "^1.28.0"
marker-pdf = "^1.10.2"
python-multipart = "^0.0.32"
tree-sitter-language-pack = "^1.12.5"
openai = "^1.100.0"
anthropic = "^0.46.0"
pinecone = {extras = ["asyncio"], version = "^9.1.0"}
rank-bm25 = "^0.2.2"
sentence-transformers = "^5.6.0"
mistral = "^22.0.0"
mistralai = "^2.7.0"
alembic = "^1.18.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
